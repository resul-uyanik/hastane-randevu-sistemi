<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRS - Randevu Yönetimi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">🏥 HRS Otomasyonu</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/">Ana Sayfa</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/view/doctors">Doktor Yönetimi</a></li>

        <li class="nav-item"><a class="nav-link" href="/view/patients">Hasta Kayıt</a></li>
        <li class="nav-item"><a class="nav-link active" href="/view/appointments">Randevular</a></li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/view/archive">🗑️ Arşiv</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom fw-bold text-warning border-start border-warning border-3">
          📅 Yeni Randevu Al
        </div>
        <div class="card-body">
          <form id="appointmentForm">
            <div class="mb-3">
              <label for="doctorSelect" class="form-label small fw-bold">Doktor Seçimi</label>
              <select class="form-select" id="doctorSelect" required>
                <option value="">-- Doktor Seçiniz --</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="patientSelect" class="form-label small fw-bold">Hasta Seçimi</label>
              <select class="form-select" id="patientSelect" required>
                <option value="">-- Hasta Seçiniz --</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="appointmentDate" class="form-label small fw-bold">Randevu Tarihi ve Saati</label>
              <input type="datetime-local" class="form-control" id="appointmentDate" required>
            </div>
            <button type="submit" class="btn btn-warning text-dark fw-bold w-100">Randevuyu Onayla</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm border-0 mb-3">
        <div class="card-body py-2 d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <label for="filterDate" class="small fw-bold text-nowrap mb-0">Tarihe Göre Filtrele:</label>
            <input type="date" id="filterDate" class="form-control form-control-sm">
            <button class="btn btn-sm btn-primary" onclick="filterAppointmentsByDate()">Filtrele</button>
          </div>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadAllAppointments()">Hepsini Göster / Yenile</button>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom fw-bold text-dark">
          📋 Güncel Randevu Listesi
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
              <tr>
                <th class="ps-3">Tarih / Saat</th>
                <th>👨‍⚕️ Doktor (Uzmanlık)</th>
                <th>👥 Hasta</th>
                <th>Durum</th>
                <th class="text-end pe-3" style="width: 25%">İşlemler</th>
              </tr>
              </thead>
              <tbody id="appointmentTableBody">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="updateAppointmentModal" tabindex="-1" aria-labelledby="updateAppointmentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title fw-bold" id="updateAppointmentModalLabel">✏️ Randevuyu Güncelle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="updateAppointmentForm">
          <input type="hidden" id="updateAppointmentId">
          <div class="mb-3">
            <label for="updateDoctorSelect" class="form-label small fw-bold">Doktor Seçimi</label>
            <select class="form-select" id="updateDoctorSelect" required></select>
          </div>
          <div class="mb-3">
            <label for="updatePatientSelect" class="form-label small fw-bold">Hasta Seçimi</label>
            <select class="form-select" id="updatePatientSelect" required></select>
          </div>
          <div class="mb-3">
            <label for="updateAppointmentDate" class="form-label small fw-bold">Randevu Tarihi ve Saati</label>
            <input type="datetime-local" class="form-control" id="updateAppointmentDate" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-warning text-dark fw-bold">Değişiklikleri Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let updateAppModal;

  document.addEventListener("DOMContentLoaded", function() {
      updateAppModal = new bootstrap.Modal(document.getElementById('updateAppointmentModal'));
      loadDoctorsToSelect();
      loadPatientsToSelect();
      loadAllAppointments();
  });

  function loadDoctorsToSelect() {
      fetch('/doctors')
          .then(response => response.json())
          .then(doctors => {
              const addSelect = document.getElementById('doctorSelect');
              const updateSelect = document.getElementById('updateDoctorSelect');

              const defaultOption = '<option value="">-- Doktor Seçiniz --</option>';
              addSelect.innerHTML = defaultOption;
              updateSelect.innerHTML = defaultOption;

              doctors.forEach(doctor => {
                  const opt = `<option value="${doctor.id}">${doctor.name} (${doctor.specialty})</option>`;
                  addSelect.innerHTML += opt;
                  updateSelect.innerHTML += opt;
              });
          });
  }

  function loadPatientsToSelect() {
      fetch('/patients')
          .then(response => response.json())
          .then(patients => {
              const addSelect = document.getElementById('patientSelect');
              const updateSelect = document.getElementById('updatePatientSelect');

              const defaultOption = '<option value="">-- Hasta Seçiniz --</option>';
              addSelect.innerHTML = defaultOption;
              updateSelect.innerHTML = defaultOption;

              patients.forEach(patient => {
                  const opt = `<option value="${patient.id}">${patient.firstName} ${patient.lastName} (TC: ${patient.identityNumber})</option>`;
                  addSelect.innerHTML += opt;
                  updateSelect.innerHTML += opt;
              });
          });
  }

  function loadAllAppointments() {
      fetch('/appointments')
          .then(response => response.json())
          .then(appointments => renderAppointmentTable(appointments));
  }

  function renderAppointmentTable(appointments) {
      const tbody = document.getElementById('appointmentTableBody');
      tbody.innerHTML = '';

      if (appointments.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Randevu kaydı bulunamadı.</td></tr>`;
          return;
      }

      appointments.forEach(app => {
          const date = new Date(app.appointmentDate);
          const formattedDate = date.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });

          const statusBadge = app.completed
              ? '<span class="badge bg-success">Tamamlandı</span>'
              : '<span class="badge bg-warning text-dark">Aktif</span>';

          const docId = app.doctor ? app.doctor.id : '';
          const patId = app.patient ? app.patient.id : '';

          const actionButtons = app.completed
              ? `<button class="btn btn-sm btn-danger" onclick="deleteAppointment(${app.id})">İptal Et</button>`
              : `
                <button class="btn btn-sm btn-outline-success me-1" onclick="completeAppointment(${app.id})">Tamamla</button>
                <button class="btn btn-sm btn-warning me-1" onclick="openUpdateModal(${app.id}, '${docId}', '${patId}', '${app.appointmentDate}')">Düzenle</button>
                <button class="btn btn-sm btn-danger" onclick="deleteAppointment(${app.id})">İptal Et</button>
              `;

          const row = `
              <tr>
                  <td class="ps-3 fw-bold">${formattedDate}</td>
                  <td>${app.doctor ? app.doctor.name : 'Silinmiş Doktor'} <small class="text-muted">(${app.doctor ? app.doctor.specialty : ''})</small></td>
                  <td>${app.patient ? app.patient.firstName + ' ' + app.patient.lastName : 'Silinmiş Hasta'}</td>
                  <td>${statusBadge}</td>
                  <td class="text-end pe-3">${actionButtons}</td>
              </tr>
          `;
          tbody.innerHTML += row;
      });
  }

  document.getElementById('appointmentForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const requestData = {
          doctorId: parseInt(document.getElementById('doctorSelect').value),
          patientId: parseInt(document.getElementById('patientSelect').value),
          appointmentDate: document.getElementById('appointmentDate').value
      };

      fetch('/appointments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestData)
      })
      .then(response => {
          if (response.ok) {
              alert('Randevu başarıyla oluşturuldu.');
              document.getElementById('appointmentForm').reset();
              loadAllAppointments();
          } else {
              return response.json().then(err => {
                  if (err.message && err.message.includes("zaman diliminde")) {
                      alert('Hata: Seçilen doktorun bu zaman diliminde randevusu var!');
                  } else {
                      alert('Randevu oluşturulamadı. Lütfen bilgileri kontrol edin!');
                  }
              });
          }
      })
      .catch(error => console.error('Randevu ekleme hatası:', error));
  });

  function openUpdateModal(id, doctorId, patientId, dateStr) {
      document.getElementById('updateAppointmentId').value = id;
      document.getElementById('updateDoctorSelect').value = doctorId;
      document.getElementById('updatePatientSelect').value = patientId;

      const formattedDate = dateStr.length > 16 ? dateStr.substring(0, 16) : dateStr;
      document.getElementById('updateAppointmentDate').value = formattedDate;

      updateAppModal.show();
  }

  document.getElementById('updateAppointmentForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const id = document.getElementById('updateAppointmentId').value;
      const requestData = {
          doctorId: parseInt(document.getElementById('updateDoctorSelect').value),
          patientId: parseInt(document.getElementById('updatePatientSelect').value),
          appointmentDate: document.getElementById('updateAppointmentDate').value
      };

      fetch(`/appointments/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestData)
      })
      .then(response => {
          if (response.ok) {
              alert('Randevu başarıyla güncellendi.');
              updateAppModal.hide();

              const filterDate = document.getElementById('filterDate').value;
              if(filterDate) filterAppointmentsByDate(); else loadAllAppointments();
          } else {
              return response.json().then(err => {
                  if (err.message && err.message.includes("zaman diliminde")) {
                      alert('Hata: Seçilen doktorun bu zaman diliminde randevusu var!');
                  } else {
                      alert('Güncelleme yapılamadı. Tarihi ve kişileri kontrol edin!');
                  }
              });
          }
      })
      .catch(error => console.error('Güncelleme hatası:', error));
  });

  function completeAppointment(id) {
      fetch(`/appointments/${id}/complete`, { method: 'PATCH' })
      .then(response => {
          if (response.ok) {
              alert('Randevu tamamlandı olarak işaretlendi.');
              const filterDate = document.getElementById('filterDate').value;
              if(filterDate) filterAppointmentsByDate(); else loadAllAppointments();
          } else {
              alert('Bu işlem gerçekleştirilemedi veya sistemde bir hata oluştu!');
          }
      });
  }

  function deleteAppointment(id) {
      if (confirm('Bu randevuyu iptal etmek istediğine emin misin ?')) {
          fetch(`/appointments/${id}`, { method: 'DELETE' })
          .then(response => {
              if (response.ok) {
                  alert('Randevu iptal edildi.');
                  const filterDate = document.getElementById('filterDate').value;
                  if(filterDate) filterAppointmentsByDate(); else loadAllAppointments();
              } else {
                  alert('Randevu iptal edilemedi veya sistemde bir hata oluştu!');
              }
          });
      }
  }

  function filterAppointmentsByDate() {
      const dateVal = document.getElementById('filterDate').value;
      if (!dateVal) {
          alert('Lütfen bir tarih seçin!!');
          return;
      }
      fetch(`/appointments/date?date=${dateVal}`)
          .then(response => response.json())
          .then(appointments => renderAppointmentTable(appointments))
          .catch(error => console.error('Filtreleme hatası:', error));
  }
</script>
</body>
</html>
