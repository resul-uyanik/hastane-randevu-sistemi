<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRS - Giriş Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
        }
        .brand-logo {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 0.5rem;
        }
        .role-btn {
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 48%;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.65rem 1rem;
        }
        .btn-submit {
            border-radius: 8px;
            padding: 0.7rem;
            font-weight: 600;
        }
        .hidden-form {
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="text-center mb-4">
        <div class="brand-logo">🏥</div>
        <h3 class="fw-bold text-dark mb-1">HRS Otomasyonu</h3>
        <p class="text-muted small">Lütfen giriş yapmak istediğiniz rolü seçiniz</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger p-2 text-center small border-0 mb-3" role="alert">
        ❌ Giriş bilgileri hatalı, lütfen tekrar deneyin!
    </div>
    <div th:if="${param.logout}" class="alert alert-success p-2 text-center small border-0 mb-3" role="alert">
        🔒 Güvenli çıkış yapıldı.
    </div>

    <div class="d-flex justify-content-between mb-4">
        <button type="button" id="adminSelectBtn" class="btn btn-outline-primary role-btn" onclick="switchRole('admin')">
            👨‍⚕️ Admin Girişi
        </button>
        <button type="button" id="userSelectBtn" class="btn btn-outline-secondary role-btn" onclick="switchRole('user')">
            👥 User Girişi
        </button>
    </div>

    <form th:action="@{/login}" method="POST" id="authForm" class="hidden-form">
        <div class="mb-3 text-center">
            <span id="roleBadge" class="badge p-2 fs-6"></span>
        </div>

        <input type="hidden" id="username" name="username">

        <div class="mb-4">
            <label for="password" class="form-label text-secondary small fw-semibold">Giriş Şifresi</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Şifrenizi girin" required>
        </div>

        <button type="submit" id="submitBtn" class="btn w-100 btn-submit shadow-sm">🚀 Giriş Yap</button>
    </form>
</div>

<script>
    function switchRole(role) {
        const form = document.getElementById('authForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const roleBadge = document.getElementById('roleBadge');
        const submitBtn = document.getElementById('submitBtn');

        const adminBtn = document.getElementById('adminSelectBtn');
        const userBtn = document.getElementById('userSelectBtn');

        form.classList.remove('hidden-form');
        passwordInput.value = ''; // Eski şifreyi temizle
        passwordInput.focus();

        if (role === 'admin') {

            adminBtn.className = "btn btn-primary role-btn";
            userBtn.className = "btn btn-outline-secondary role-btn";

            usernameInput.value = 'admin';
            passwordInput.placeholder = 'Admin şifresini girin (admin123)';

            roleBadge.className = "badge bg-primary p-2 fs-6";
            roleBadge.textContent = "Yönetici (Admin) Modu Aktif";
            submitBtn.className = "btn btn-primary btn-submit w-100 shadow-sm";
        } else if (role === 'user') {

            adminBtn.className = "btn btn-outline-primary role-btn";
            userBtn.className = "btn btn-secondary role-btn";

            usernameInput.value = 'user';
            passwordInput.placeholder = 'Kullanıcı şifresini girin (1234)';

            roleBadge.className = "badge bg-secondary p-2 fs-6";
            roleBadge.textContent = "Standart Kullanıcı (User) Modu Aktif";
            submitBtn.className = "btn btn-secondary btn-submit w-100 shadow-sm";
        }
    }
</script>
</body>
</html>
